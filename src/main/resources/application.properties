spring.application.name=ticket-service

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
logging.level.liquibase=INFO

# DB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticket_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticket_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Event service
clients.event-service.url=${EVENT_SERVICE_URL:http://localhost:8082}

# Feign
spring.cloud.openfeign.client.config.event-service.connectTimeout=500
spring.cloud.openfeign.client.config.event-service.readTimeout=1500
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
app.kafka.notification-topic=notification.events

# Zipkin
# Fejlesztéskor minden kérés kerüljön Zipkinbe.
management.tracing.sampling.probability=1.0
# A Zipkin Docker konténer címe.
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
