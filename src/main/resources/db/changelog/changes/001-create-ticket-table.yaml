databaseChangeLog:
  - changeSet:
      id: 001-create-ticket-table
      author: janos
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tickets
                    nullable: false

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: ticket_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: price_paid
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: CHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tickets_code

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: checked_in_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_event_id
            columns:
              - column:
                  name: event_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_owner_id
            columns:
              - column:
                  name: owner_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_order_id
            columns:
              - column:
                  name: order_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_status
            columns:
              - column:
                  name: status
